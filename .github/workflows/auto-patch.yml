name: AI HTML Patch

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: startsWith(github.event.issue.title, '[PATCH]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Apply requested patch
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          body = os.environ.get("ISSUE_BODY", "")

          def extract(name):
              pattern = rf"### {re.escape(name)}\s*\n```(?:text|html)?\n(.*?)\n```"
              m = re.search(pattern, body, re.S)
              if not m:
                  raise SystemExit(f"Не найден блок: {name}")
              return m.group(1)

          old = extract("SEARCH")
          new = extract("REPLACE")

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          count = text.count(old)

          if count != 1:
              raise SystemExit(
                  f"Безопасность: найдено совпадений: {count}. "
                  f"Ожидалось ровно 1."
              )

          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          print("Изменение применено.")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html
          git commit -m "fix: automated HTML patch"
          git push

      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}" \
            --comment "Изменение применено автоматически."
