<style>:root{--bg:#05070a;--text:#f7f8fb;--muted:#8d94a0;--line:rgba(255,255,255,.09);--accent:#7aa7ff;--accent2:#c8d8ff;--bubble:#171b22;--glow:rgba(84,122,255,.12);--radius:26px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#05070a;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter",Arial,sans-serif}body{overflow-x:hidden}

.screen{min-height:calc(100vh - 60px);padding:32px 0 18px;position:relative}.screen:after{content:"";position:fixed;z-index:-1;left:50%;bottom:-18vh;width:520px;height:360px;transform:translateX(-50%);background:radial-gradient(circle,var(--glow),transparent 68%);filter:blur(8px);pointer-events:none;transition:background 900ms ease}
.eyebrow{font-size:9px;letter-spacing:.2em;color:#727986;text-transform:uppercase;font-weight:700;margin-bottom:13px}.scene-meta{display:flex;align-items:center;gap:7px;color:#626a77;font-size:8px;letter-spacing:.15em;text-transform:uppercase;margin:-4px 2px 17px}.scene-dot{width:5px;height:5px;border-radius:50%;background:#858c98;box-shadow:0 0 15px currentColor}

.choices{margin-top:auto;padding-top:16px;display:grid;gap:10px}.choice{position:relative;width:100%;min-height:64px;border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:14px 45px 14px 17px;background:rgba(17,20,26,.72);color:#f5f6f9;font-size:15.5px;line-height:1.3;text-align:left;cursor:pointer;transition:transform .16s ease,border-color .2s ease,background .2s ease,box-shadow .2s ease}.choice:after{content:"↗";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:15px;color:#707886;transition:transform .18s ease,color .18s ease}.choice:hover{background:rgba(27,31,39,.92);border-color:rgba(255,255,255,.18)}.choice:hover:after{transform:translate(2px,-50%);color:#fff}.choice.primary{background:#eef1f6;color:#080a0d;border-color:#fff;box-shadow:0 12px 35px rgba(0,0,0,.18)}.choice.primary:after{color:#555d69}.choice:active{transform:scale(.985)}.choice:focus-visible{outline:2px solid #fff;outline-offset:3px}
.scene-long .choices{padding-top:16px;border-top:1px solid rgba(255,255,255,.07)}.end-screen{min-height:calc(100vh - 90px);display:flex;flex-direction:column;justify-content:center;padding:6vh 0}.end-screen h2{font-size:clamp(44px,13vw,70px)}.end-card{margin:8px 0 18px;padding:20px;border:1px solid rgba(255,255,255,.1);border-radius:26px;background:linear-gradient(145deg,rgba(25,29,37,.88),rgba(10,12,16,.76));box-shadow:0 22px 80px rgba(0,0,0,.3)}.end-card .small{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#6e7682}.end-card p{font-size:15px;margin:8px 0 0;color:#dce0e7}.end-cta{padding:18px 0;border-top:1px solid rgba(255,255,255,.1);color:#aeb5c0;font-size:14px;line-height:1.6}
@media(max-width:520px){.app{padding-left:13px;padding-right:13px}.top{margin-left:-13px;margin-right:-13px;padding-left:15px;padding-right:15px}.screen{padding-top:27px}.msg{font-size:15.7px}.choice{min-height:62px;font-size:15px}.intro-hero{min-height:64vh}}
@media(prefers-reduced-motion:no-preference){.fade{animation:fade .34s ease}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes msgIn{from{opacity:0;transform:translateY(7px) scale(.985)}to{opacity:1;transform:none}}@keyframes typingDot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}}</style>

const nodes={"start":{"type":"intro","title":"ДО / ПОСЛЕ","text":"Интерактивная история о том, как обычное общение может постепенно менять правила. Здесь нет заранее «правильного» маршрута: каждое решение влияет на то, что произойдёт дальше.","button":"Начать","next":"contact"},"contact":{"title":"ТЕБЕ ПИШЕТ НЕЗНАКОМЫЙ ЧЕЛОВЕК.","chat":[["them","Привет. Видел твой пост. Круто написал. Мы раньше не общались?"]],"choices":[["Не хочу общаться.","contact_pressure"],["Нет, не общались. А ты кто?","contact_open"],["Ничего не отвечать.","contact_silent"]]},"contact_pressure":{"title":"ТЫ ПОСТАВИЛ ГРАНИЦУ.","chat":[["them","Да ладно. Чего ты сразу? Просто пять минут поговорим."]],"choices":[["Нет. Я сказал, что не хочу.","end_boundary"],["Ну ладно. Что хотел?","pressure_continue"],["Заблокировать.","end_block"]],"echoChoice":true},"contact_silent":{"title":"ТЫ НЕ ОТВЕТИЛ.","chat":[["them","Окей. Если не хочешь — не отвечай. Просто подумал, что тебе может быть интересно."],["them","Если всё-таки интересно, могу рассказать про один закрытый чат."]],"text":"Он не требует ответа и не давит. Но оставляет возможность продолжить разговор, если ты сам захочешь.","choices":[["Не отвечать.","end_silent"],["Что за чат?","chat_info"]]},"contact_open":{"title":"ТЫ ОТВЕТИЛ.","chat":[["them","Да просто увидел твой пост. Интересно пишешь. Есть закрытый чат, там ребята примерно твоего возраста. Могу скинуть, если хочешь."]],"choices":[["Что за чат?","chat_info"],["Неинтересно.","chat_refuse"],["Добавь меня.","chat_join"]],"echoChoice":true},"chat_refuse":{"title":"ТЫ ОТКАЗАЛСЯ.","chat":[["them","Окей. Не буду навязываться."]],"choices":[["Закончить историю.","end_safe"]],"echoChoice":true},"chat_info":{"title":"ТЫ УЗНАЁШЬ О ЧАТЕ.","chat":[["them","Это обычный закрытый чат. Обсуждаем музыку, новости и то, что происходит вокруг. Если не зайдёт — выйдешь."]],"choices":[["Если можно, добавь меня.","chat_join"],["Нет, спасибо.","chat_refuse"],["А зачем он закрытый?","chat_why"]],"echoChoice":true},"chat_why":{"title":"ТЫ НЕ ПРОСТО СОГЛАСИЛСЯ.","chat":[["them","Потому что со стороны не всегда правильно понимают, о чём мы говорим. Не хочется, чтобы наши разговоры трактовали как-то иначе."]],"choices":[["Ладно, посмотрю.","chat_join"],["Мне не нравится такая идея.","end_safe"],["Что ты имеешь в виду?","chat_explain"]],"echoChoice":true},"chat_explain":{"title":"ТЫ ПРОСИШЬ ОБЪЯСНИТЬ.","chat":[["them","Ничего особенного. Просто здесь люди, которым интересно обсуждать одни и те же темы без лишнего шума."]],"choices":[["Покажи, что там происходит.","chat_join"],["Тогда я пас.","end_safe"]],"echoChoice":true},"chat_join":{"title":"ТЫ ВОШЁЛ В ЧАТ.","chat":[["them","Хорошо. Сейчас добавлю."],["them","Готово. Вот чат. Освойся."]],"text":"Первые сообщения выглядят обычно: музыка, мемы, разговоры о городе и о том, что бесит.","choices":[["Остаться и посмотреть.","belonging"],["Выйти.","end_exit_chat"]],"echoChoice":true},"belonging":{"title":"ПРОШЛО НЕМНОГО ВРЕМЕНИ.","beforeText":"Прошло несколько дней. Ты иногда заходил в чат, что-то читал, иногда отвечал. Постепенно тебя начали воспринимать как своего.","chat":[["them","Слушай, а ты вообще с нами или просто наблюдаешь?"]],"choices":[["Я реально с вами.","loyalty_yes"],["А что значит «с вами»?","loyalty_question"],["Ничего не отвечать.","loyalty_silent"],["Мне это уже не нравится. Я выхожу.","end_exit_chat"]],"echoChoice":true},"loyalty_yes":{"title":"ТЫ РЕШИЛ БЫТЬ С НИМИ.","echoChoice":true,"chat":[["them","Окей. Тогда дальше всё проще. Есть одна вещь, о которой мы не рассказываем посторонним."]],"choices":[["Что именно вы не рассказываете?","secrecy_question"],["Мне не нравится, что от меня уже что-то скрывают.","end_exit_chat"]]},"loyalty_question":{"title":"ТЫ ПРОСИШЬ УТОЧНИТЬ.","chat":[["them","Что тебе интересны наши разговоры и ты хочешь быть частью компании, а не просто читать со стороны."]],"choices":[["Понял. Я с вами.","loyalty_yes"],["Я пока просто смотрю.","observer_response"],["Тогда я, пожалуй, выйду.","end_exit_chat"]],"echoChoice":true},"loyalty_silent":{"title":"ТЫ ПРОМОЛЧАЛ.","chat":[["them","Я не понял. Ты хочешь просто читать или хочешь быть с нами?"]],"choices":[["Я пока просто смотрю.","observer_response"],["Я с вами.","loyalty_yes"],["Не хочу продолжать.","end_exit_chat"]],"echoChoice":true},"observer_response":{"title":"ТЫ НЕ СТАЛ ДАВАТЬ ОБЕЩАНИЙ.","chat":[["them","Окей. Тогда просто оставайся наблюдателем. Не всё, что обсуждаем здесь, мы готовы рассказывать каждому."]],"text":"Ты не согласился на новые условия. Теперь решение за тобой: остаться наблюдателем или выйти.","choices":[["Остаться и посмотреть дальше.","observer_stay"],["Выйти.","end_exit_chat"]],"echoChoice":true},"observer_stay":{"title":"ТЫ ОСТАЛСЯ НАБЛЮДАТЕЛЕМ.","chat":[["them","Хорошо. Тогда просто читай. Никто тебя не торопит."]],"beforeText":"Через некоторое время в чате впервые появляется правило о том, что часть разговоров должна оставаться внутри.","chatAfter":[["them","Давайте некоторые вещи здесь не выносить наружу."]],"text":"Ты можешь решить, как к этому относиться.","choices":[["Что именно вы не хотите выносить наружу?","secrecy_question"],["Просто промолчать.","secrecy_silent"],["Мне это не подходит. Выйду.","end_exit_chat"]]},"secrecy_question":{"title":"ТЫ УТОЧНЯЕШЬ.","chat":[["them","Ничего конкретного. Скорее, просто не хочется, чтобы отдельные разговоры из этого чата уходили наружу."]],"choices":[["Почему?","secrecy_why"],["Я не хочу соглашаться на такие правила.","end_exit_chat"],["Если мне станет некомфортно, я всё равно расскажу человеку, которому доверяю.","help_prepressure"]],"echoChoice":true},"secrecy_silent":{"type":"end","title":"ТЫ ПРОМОЛЧАЛ.","text":"Ты не согласился и не отказался — просто не стал отвечать. Молчание не означает согласие, но и не решает ситуацию. Если подобное происходит в реальной жизни, важно не оставаться с этим один на один и рассказать человеку, которому доверяешь, или обратиться к специалисту.","label":"Молчание под давлением."},"secrecy_a const state={node:"start",path:[]};
const screen=document.getElementById("screen");
const storyState=document.getElementById("storyState");

function restart(){
  state.node="start";
  state.path=[];
  render();
}
function choose(index){
  const node=nodes[state.node];
  if(!node||!Array.isArray(node.choices)||!node.choices[index]) return;
  const [label,next]=node.choices[index];
  if(!nodes[next]) return;
  state.path.push({node:state.node,choice:label});
  state.node=next;
  render();
}
function esc(value){
  return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const audio={
  enabled:true,started:false,ctx:null,master:null,music:null,timer:null,mood:.12,step:0,nextTime:0,bpm:70,phase:"calm",nodes:[],
  init(){if(this.started)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.ctx=new C();this.master=this.ctx.createGain();this.master.gain.value=.0001;this.master.connect(this.ctx.destination);this.music={filter:this.ctx.createBiquadFilter()};this.music.filter.type="lowpass";this.music.filter.frequency.value=2100;this.music.filter.Q.value=.5;this.music.filter.connect(this.master);this.started=true;this.ctx.resume();this.startMusic();this.setPhase("calm",true);this.fadeIn()}catch(e){console.warn("Audio unavailable",e)}},
  startMusic(){if(!this.started||this.timer)return;this.nextTime=this.ctx.currentTime+.08;this.step=0;this.timer=setInterval(()=>this.scheduleMusic(),90)},
  stopMusic(){if(this.timer){clearInterval(this.timer);this.timer=null}},
  tone(freq,time,duration,volume,type="sine",detune=0){const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,time);o.detune.value=detune;g.gain.setValueAtTime(.0001,time);g.gain.exponentialRampToValueAtTime(Math.max(.0001,volume),time+.035);g.gain.exponentialRampToValueAtTime(.0001,time+duration);o.connect(g);g.connect(this.music.filter);o.start(time);o.stop(time+duration+.03)},
  chord(freqs,time,duration,volume){freqs.forEach((f,i)=>this.tone(f,time,duration,volume*(i===0?1:.65),i===0?"sine":"triangle"))},
  scheduleMusic(){if(!this.started||!this.enabled)return;const c=this.ctx,beat=60/this.bpm,horizon=c.currentTime+.5;
    const calmCh=[[146.83,174.61,220],[130.81,164.81,196],[146.83,196,246.94],[130.81,164.81,220]];
    const shiftCh=[[146.83,174.61,220],[116.54,146.83,174.61],[130.81,164.81,196],[146.83,174.61,220]];
    const tenseCh=[[146.83,174.61,220],[138.59,164.81,207.65],[146.83,184.99,233.08],[138.59,174.61,207.65]];
    const calmMel=[293.66,0,349.23,0,392,349.23,329.63,0,293.66,0,261.63,293.66,349.23,0,329.63,0];
    const shiftMel=[293.66,0,293.66,349.23,392,0,349.23,293.66,261.63,0,293.66,349.23,392,349.23,329.63,0];
    const tenseMel=[293.66,311.13,0,349.23,0,311.13,293.66,0,277.18,293.66,0,349.23,311.13,0,277.18,0];
    const chords=this.phase==="pressure"?tenseCh:this.phase==="shift"?shiftCh:calmCh;
    const melody=this.phase==="pressure"?tenseMel:this.phase==="shift"?shiftMel:calmMel;
    while(this.nextTime<horizon){const step=this.step%16;if(step%4===0){const ch=chords[(this.step/4|0)%4];this.chord(ch,this.nextTime,beat*3.5,this.phase==="pressure" ? .015 : this.phase==="shift" ? .012 : .009)}
      const note=melody[step];if(note)this.tone(note,this.nextTime,beat*(this.phase==="pressure" ? .55 : .72),this.phase==="pressure" ? .008 : this.phase==="shift" ? .009 : .007,this.phase==="pressure"?"triangle":"sine");
      if(this.phase!=="calm"&&step%2===0)this.tone(73.42,this.nextTime,beat*.35,this.phase==="pressure" ? .006 : .003,"sine");
      this.nextTime+=beat;this.step++}},
  setPhase(phase,instant=false){this.phase=phase;this.bpm=phase==="pressure"?78:phase==="shift"?74:68;if(!this.started)return;const t=this.ctx.currentTime;const target=phase==="pressure" ? .075 : phase==="shift" ? .060 : .050;this.music.filter.frequency.cancelScheduledValues(t);this.music.filter.frequency.linearRampToValueAtTime(phase==="pressure"?1200:phase==="shift"?1650:2200,t+(instant ? .02 : .7));this.master.gain.cancelScheduledValues(t);if(this.enabled)this.master.gain.linearRampToValueAtTime(target,t+(instant ? .02 : .7));},

  send(){if(!this.enabled||!this.started)return;const c=this.ctx,n=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.setValueAtTime(480,n);o.frequency.exponentialRampToValueAtTime(360,n+.09);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.045,n+.012);g.gain.exponentialRampToValueAtTime(.0001,n+.14);o.connect(g);g.connect(this.master);o.start(n);o.stop(n+.16)},

try{audio.enabled=localStorage.getItem("doPosleSound")!=="0"}catch(e){}
function updateSoundButton(){const b=document.getElementById("soundToggle");if(!b)return;b.textContent=audio.enabled?"🔊":"🔇";b.setAttribute("aria-label",audio.enabled?"Выключить звук":"Включить звук")}
function audioMoodFor(k){if(/^end_/.test(k))return .06;if(["demand_explain","involvement","help","help_prepressure"].includes(k))return .72;if(["secrecy_question","secrecy_why","secrecy_accept","observer_stay"].includes(k))return .42;if(["belonging","loyalty_yes","loyalty_question","loyalty_silent","observer_response"].includes(k))return .24;return .08}
function storyPhase(k){if(/^end_/.test(k))return "after";if(["demand_explain","involvement","help","help_prepressure","secrecy_accept","secrecy_continue"].includes(k))return "pressure";if(["belonging","loyalty_yes","loyalty_question","loyalty_silent","observer_response","observer_stay","secrecy_question","secrecy_why"].includes(k))return "shift";return "calm"}
function playIncomingFor(n){if(!audio.enabled||!audio.started||!n)return;const all=[];if(Array.isArray(n.chat))all.push(...n.chat);if(Array.isArray(n.chatAfter))all.push(...n.chatAfter);const count=all.filter(m=>m[0]==="them").length;for(let i=0;i<count;i++)setTimeout(()=>audio.notify(),700+i*620)}
function revealMessages(){
  const msgs=[...screen.querySelectorAll('.msg.them')];
  if(!msgs.length)return;
  msgs.forEach((m,i)=>{m.style.display='none';m.style.animationDelay='0s';setTimeout(()=>{
    const typing=document.createElement('div');typing.className='typing';typing.innerHTML='<i></i><i></i><i></i>';m.parentNode.insertBefore(typing,m);
    setTimeout(()=>{typing.remove();m.style.display='block';},520);
  },i*1050);});
}
function render(){
  const node=nodes[state.node];
  if(!node){restart();return;}
  const phase=storyPhase(state.node);
  storyState.textContent=phase==="pressure"?"НАПРЯЖЕНИЕ":phase==="shift"?"РАЗГОВОР МЕНЯЕТСЯ":phase==="after"?"ПОСЛЕ":"ИСТОРИЯ";
  storyState.classList.toggle("tense",phase!=="calm"); document.documentElement.style.setProperty("--glow", phase==="pressure"?"rgba(255,76,76,.13)":phase==="shift"?"rgba(255,180,55,.10)":"rgba(10,132,255,.12)"); if(audio.started) audio.setPhase(phase,true);
  let html="";
  if(node.type==="intro"){
    html='<div class="intro-hero"><div class="intro-mark">ДО<br>ПОСЛЕ</div><div class="eyebrow">ИНТЕРАКТИВНАЯ ИСТОРИЯ</div><h1>'+esc(node.title)+'</h1><p class="intro-sub">'+esc(node.text)+'</p><div class="intro-card"><div class="intro-card-num">01</div><div class="small">Твои решения не «правильные» и не «неправильные». Они меняют то, что произойдёт дальше.</div></div></div><div class="choices"><button type="button" class="choice primary" data-start>Начать историю</button></div>';
  } else if(node.type==="end"){
    html='<div class="end-screen"><div class="eyebrow">ПОСЛЕ</div><h2>'+esc(node.title)+'</h2><p>'+esc(node.text)+'</p>'+
    '<div class="end-card"><div class="small">ТВОЯ ТОЧКА ОСТАНОВКИ</div><p>'+esc(node.label)+'</p></div>'+
    '<div class="end-cta">У каждого «ПОСЛЕ» когда-то было «ДО». Если в реальной жизни тебе или кому-то рядом становится некомфортно, страшно или на тебя давят — не оставайся с этим один. Обратись к человеку, которому доверяешь, или к специалисту.</div>'+
    '<div class="choices"><button type="button" class="choice primary" data-restart>Пройти заново</button></div></div>';
  } else {
    const echoCount=node.echoChoice&&state.path.length?1:0;
    const chatCount=(Array.isArray(node.chat)?node.chat.length:0)+(Array.isArray(node.chatAfter)?node.chatAfter.length:0)+echoCount;
    const density=chatCount<=3?'short':chatCount<=6?'medium':'long';
    html='<div class="scene scene-'+density+'">';
    html+='<div class="eyebrow">СЦЕНА '+(state.path.length+1)+'</div><div class="scene-meta"><span class="scene-dot"></span><span>Переписка</span></div><h2>'+esc(node.title)+'</h2>';
    if(node.beforeText) html+='<div class="narrative-wrap narrative-before"><div class="narrative-label">Происходящее</div><div class="narrative">'+esc(node.beforeText)+'</div></div>';
    if(chatCount){
      html+='<div class="chat-shell chat-'+density+'">';
      html+='<div class="chat-head"><div class="chat-avatar">•••</div><div class="chat-head-text"><div class="chat-head-title">Переписка</div><div class="chat-head-sub">сообщения</div></div></div>';
      html+='<div class="chat">';
      if(node.echoChoice && state.path.length){ const prev=state.path[state.path.length-1]; html+='<div class="msg you">'+esc(prev.choice)+'</div>'; }
      if(Array.isArray(node.chat)) html+=node.chat.map(m=>'<div class="msg '+(m[0]==="you"?'you':'them')+'">'+esc(m[1])+'</div>').join('');
      if(Array.isArray(node.chatAfter)) html+=node.chatAfter.map(m=>'<div class="msg '+(m[0]==="you"?'you':'them')+'">'+esc(m[1])+'</div>').join('');
      html+='</div></div>';

document.addEventListener("click",e=>{
  const btn=e.target.closest("button");
  if(!btn) return;
  if(btn.id==="soundToggle"){audio.toggle();return;}
  if(btn.hasAttribute("data-start")){if(audio.enabled){audio.init();audio.fadeIn();}state.node=nodes.start.next;state.path.push({node:"start",choice:"Начать"});render();return;}
  if(btn.hasAttribute("data-restart")){restart();return;}
  if(btn.hasAttribute("data-choice")){if(audio.enabled){if(!audio.started)audio.init();if(audio.ctx&&audio.ctx.state==="suspended")audio.ctx.resume();audio.send();}choose(Number(btn.dataset.choice));}
});
document.addEventListener("visibilitychange",()=>{if(!audio.started)return;if(document.hidden)audio.fadeOut();else if(audio.enabled)audio.fadeIn()});
render();
updateSoundButton();
