const state={node:"start",path:[]};
const screen=document.getElementById("screen");
const progress=document.getElementById("progress");

function restart(){
  state.node="start";
  state.path=[];
  render();
}
function choose(index){
  const node=nodes[state.node];
  if(!node||!Array.isArray(node.choices)||!node.choices[index]) return;
  const [label,next]=node.choices[index];
  if(!nodes[next]) return;
  state.path.push({node:state.node,choice:label});
  state.node=next;
  render();
}
function esc(value){
  return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const audio={
  enabled:true,started:false,ctx:null,master:null,music:null,timer:null,
  mood:.12,step:0,nextTime:0,bpm:72,
  init(){
    if(this.started)return;
    try{
      const C=window.AudioContext||window.webkitAudioContext;
      if(!C)return;
      this.ctx=new C();
      this.master=this.ctx.createGain();
      this.master.gain.value=.0001;
      this.master.connect(this.ctx.destination);

      const filter=this.ctx.createBiquadFilter();
      filter.type="lowpass";
      filter.frequency.value=1800;
      filter.Q.value=.35;
      filter.connect(this.master);

      this.music={filter};
      this.started=true;
      this.ctx.resume();
      this.startMusic();
      this.setMood(.12,true);
    }catch(e){console.warn("Audio unavailable",e)}
  },
  startMusic(){
    if(!this.started||this.timer)return;
    this.nextTime=this.ctx.currentTime+.08;

    this.timer=setInterval(()=>this.scheduleMusic(),90);
  },
  stopMusic(){
    if(this.timer){clearInterval(this.timer);this.timer=null}
  },
  tone(freq,time,duration,volume,type="sine"){
    const c=this.ctx;
    const o=c.createOscillator(),g=c.createGain();
    o.type=type;
    o.frequency.setValueAtTime(freq,time);
    g.gain.setValueAtTime(.0001,time);
    g.gain.exponentialRampToValueAtTime(Math.max(.0001,volume),time+.045);
    g.gain.exponentialRampToValueAtTime(.0001,time+duration);
    o.connect(g);g.connect(this.music.filter);
    o.start(time);o.stop(time+duration+.03);
  },
  chord(freqs,time,duration,volume){
    freqs.forEach((f,i)=>this.tone(f,time,duration,volume*(i===0?1:.72),i===0?"sine":"triangle"));
  },
  scheduleMusic(){
    if(!this.started||!this.enabled)return;
    const c=this.ctx, beat=60/this.bpm, horizon=c.currentTime+.45;
    const chords=[
      [146.83,174.61,220.00], // Dm
      [116.54,146.83,174.61], // Bb
      [130.81,164.81,196.00], // C
      [130.81,164.81,220.00]  // F
    ];
    const melody=[
      293.66,0,349.23,0,392.00,349.23,329.63,0,
      293.66,0,261.63,293.66,349.23,0,329.63,0
    ];
    while(this.nextTime<horizon){
      const step=this.step%16;
      if(step%4===0){
        const ch=chords[(this.step/4|0)%chords.length];

        this.chord(ch,this.nextTime,beat*3.7,padVolume);
      }

      }
      this.nextTime+=beat;
      this.step++;

      1800-(this.mood*450),t+(instant?.01:.8)
    );
    this.master.gain.cancelScheduledValues(t);
    if(this.enabled)this.master.gain.linearRampToValueAtTime(target,t+(instant?.01:.7));
  },
  notify(){
    if(!this.enabled||!this.started)return;
    const c=this.ctx,n=c.currentTime;
    const o=c.createOscillator(),g=c.createGain();
    o.type="sine";
    o.frequency.setValueAtTime(740,n);
    o.frequency.exponentialRampToValueAtTime(520,n+.12);
    g.gain.setValueAtTime(.0001,n);
    g.gain.exponentialRampToValueAtTime(.035,n+.018);
    g.gain.exponentialRampToValueAtTime(.0001,n+.22);
    o.connect(g);g.connect(this.master);
    o.start(n);o.stop(n+.24);
  },
  send(){
    if(!this.enabled||!this.started)return;
    const c=this.ctx,n=c.currentTime;
    const o=c.createOscillator(),g=c.createGain();
    o.type="sine";
    o.frequency.setValueAtTime(480,n);
    o.frequency.exponentialRampToValueAtTime(360,n+.09);
    g.gain.setValueAtTime(.0001,n);
    g.gain.exponentialRampToValueAtTime(.018,n+.012);
    g.gain.exponentialRampToValueAtTime(.0001,n+.14);
    o.connect(g);g.connect(this.master);
    o.start(n);o.stop(n+.16);
  },
  fadeOut(){
    if(!this.started)return;
    const t=this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.linearRampToValueAtTime(.0001,t+.8);
  },
  fadeIn(){
    if(!this.started||!this.enabled)return;
    this.startMusic();
    const t=this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.linearRampToValueAtTime(.72+(this.mood*.28),t+.7);
  },
  toggle(){
    this.enabled=!this.enabled;
    try{localStorage.setItem("doPosleSound",this.enabled?"1":"0")}catch(e){}
    if(this.enabled){
      this.init();
      this.fadeIn();
    }else{
      this.fadeOut();
    }
    updateSoundButton();
  }
};
try{audio.enabled=localStorage.getItem("doPosleSound")!=="0"}catch(e){}
function updateSoundButton(){const b=document.getElementById("soundToggle");if(!b)return;b.textContent=audio.enabled?"🔊":"🔇";b.setAttribute("aria-label",audio.enabled?"Выключить звук":"Включить звук")}
function audioMoodFor(k){if(/^end_/.test(k))return .10;if(["demand_explain","involvement","help","help_prepressure"].includes(k))return .62;if(["secrecy_question","secrecy_why","secrecy_accept","observer_stay"].includes(k))return .45;if(["belonging","loyalty_yes","loyalty_question","loyalty_silent","observer_response"].includes(k))return .28;return .14}
function playIncomingFor(n){if(!audio.enabled||!audio.started||!n||!Array.isArray(n.chat))return;const count=n.chat.filter(m=>m[0]==="them").length;for(let i=0;i<count;i++)setTimeout(()=>audio.notify(),260+i*430)}
function render(){
  const node=nodes[state.node];
  if(!node){restart();return;}
  if(audio.started)audio.setMood(audioMoodFor(state.node));
  const steps=Math.min(state.path.length+1,12);
  progress.innerHTML=Array.from({length:12},(_,i)=>'<i class="dot '+(i<steps?'on':'')+'"></i>').join("");
  let html="";
  if(node.type==="intro"){
    html='<div class="eyebrow">ИНТЕРАКТИВНАЯ ИСТОРИЯ</div><h1>'+esc(node.title)+'</h1><p>'+esc(node.text)+'</p>'+
    '<div class="card"><div class="small">Твои решения не «правильные» и не «неправильные». Они меняют то, что произойдёт дальше.</div></div>'+
    '<div class="choices"><button type="button" class="choice primary" data-start>Начать</button></div>';
  } else if(node.type==="end"){
    html='<div class="eyebrow">ИСТОРИЯ ЗАКОНЧЕНА</div><h2>'+esc(node.title)+'</h2><p>'+esc(node.text)+'</p>'+
    '<div class="card"><div class="small">ТВОЯ ТОЧКА ОСТАНОВКИ</div><p style="margin-top:8px">'+esc(node.label)+'</p></div>'+
    '<div class="card"><div class="small">У каждого «ПОСЛЕ» когда-то было «ДО». Если в реальной жизни тебе или кому-то рядом становится некомфортно, страшно или на тебя давят — не оставайся с этим один. Обратись к человеку, которому доверяешь, или к специалисту.</div></div>'+
    '<div class="choices"><button type="button" class="choice primary" data-restart>Пройти заново</button></div>';
  } else {
    html='<div class="eyebrow">СЦЕНА '+(state.path.length+1)+'</div><h2>'+esc(node.title)+'</h2>';
    if(node.beforeText) html+='<div class="narrative-wrap narrative-before"><div class="narrative-label">Происходящее</div><div class="narrative">'+esc(node.beforeText)+'</div></div>';
    if(node.echoChoice && state.path.length){ const prev=state.path[state.path.length-1]; html+='<div class="chat"><div class="msg you">'+esc(prev.choice)+'</div></div>'; }
    if(Array.isArray(node.chat)) html+='<div class="chat">'+node.chat.map(m=>'<div class="msg '+(m[0]==="you"?'you':'them')+'">'+esc(m[1])+'</div>').join('')+'</div>';
    if(Array.isArray(node.chatAfter)) html+='<div class="chat">'+node.chatAfter.map(m=>'<div class="msg '+(m[0]==="you"?'you':'them')+'">'+esc(m[1])+'</div>').join('')+'</div>';
    if(node.text) html+='<div class="narrative-wrap"><div class="narrative-label">Происходящее</div><div class="narrative">'+esc(node.text)+'</div></div>';
    html+='<div class="choices">'+node.choices.map((c,i)=>'<button type="button" class="choice '+(i===0?'primary':'')+'" data-choice="'+i+'">'+esc(c[0])+'</button>').join('')+'</div>';
  }
  screen.innerHTML=html;
  updateSoundButton();
  if(state.node!=="start"&&node.type!=="end"){playIncomingFor(node)}
  if(node.type==="end")audio.fadeOut();
  const first=screen.querySelector('button');
  if(first) first.focus({preventScroll:true});
  window.scrollTo({top:0,behavior:"smooth"});
}
document.addEventListener("click",e=>{
  const btn=e.target.closest("button");
  if(!btn) return;
  if(btn.id==="soundToggle"){audio.toggle();return;}
  if(btn.hasAttribute("data-start")){if(audio.enabled){audio.init();audio.fadeIn();}state.node=nodes.start.next;state.path.push({node:"start",choice:"Начать"});render();return;}
  if(btn.hasAttribute("data-restart")){restart();return;}
  if(btn.hasAttribute("data-choice")){if(audio.started&&audio.enabled)audio.send();choose(Number(btn.dataset.choice));}
});
document.addEventListener("visibilitychange",()=>{if(!audio.started)return;if(document.hidden)audio.fadeOut();else if(audio.enabled)audio.fadeIn()});
render();
updateSoundButton();
</script>
</body>
</html>
