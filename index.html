<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ДО / ПОСЛЕ — интерактивная история</title>
<style>
 :root{--bg:#0b0c0f;--panel:#15171c;--panel2:#1c1f25;--text:#f5f5f7;--muted:#9b9da5;--line:#2a2d34;--accent:#0a84ff;--bubble:#123a63;--radius:22px;--page-glow:rgba(10,132,255,.10)}
html[data-theme="day"]{--bg:#f4f5f7;--panel:#ffffff;--panel2:#e9ebef;--text:#17181c;--muted:#6e727c;--line:#d8dbe1;--accent:#007aff;--bubble:#d7e9ff;--page-glow:rgba(0,122,255,.08)}
html[data-theme="night"]{--bg:#0b0c0f;--panel:#15171c;--panel2:#1c1f25;--text:#f5f5f7;--muted:#9b9da5;--line:#2a2d34;--accent:#0a84ff;--bubble:#123a63;--page-glow:rgba(10,132,255,.10)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter",Arial,sans-serif}
body{display:flex;justify-content:center}
button{font:inherit}
.app{width:min(100%,760px);min-height:100vh;padding:env(safe-area-inset-top) 16px calc(28px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:10;padding:14px 0 10px;background:linear-gradient(var(--bg) 78%,transparent);display:flex;align-items:flex-start;gap:12px}.top-main{flex:1}.sound-toggle{width:38px;height:38px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);font-size:18px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}.sound-toggle:active{transform:scale(.96)}
.brand{font-size:13px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.progress{display:flex;gap:5px;margin-top:10px}.dot{height:4px;flex:1;border-radius:99px;background:#282b31;transition:background .25s ease,opacity .25s ease}.dot.on{background:#f5f5f7}
.screen{padding:26px 0 30px;min-height:calc(100vh - 75px);display:flex;flex-direction:column}
.eyebrow{font-size:13px;color:var(--muted);margin-bottom:14px}.scene-meta{display:flex;align-items:center;gap:8px;margin:-3px 0 12px;color:#70747e;font-size:11px;letter-spacing:.12em;text-transform:uppercase}.scene-meta .scene-dot{width:5px;height:5px;border-radius:50%;background:#555a65}
h1{font-size:clamp(34px,9vw,64px);line-height:.98;letter-spacing:-.045em;margin:0 0 18px}h2{font-size:clamp(26px,7vw,40px);line-height:1.03;letter-spacing:-.035em;margin:0 0 18px}p{font-size:18px;line-height:1.42;margin:0 0 18px}
/* Универсальная переписка: короткие ветки остаются лёгкими, длинные получают отдельную поверхность. */
.chat-shell{margin:8px 0 24px}.chat-head{display:flex;align-items:center;gap:10px;padding:0 4px 10px;color:#8f939d;font-size:12px}.chat-avatar{width:30px;height:30px;border-radius:10px;background:#24272d;border:1px solid #333740;display:grid;place-items:center;font-size:11px;color:#c8cad0}.chat-head-text{display:flex;flex-direction:column;gap:2px}.chat-head-title{font-size:13px;color:#c9cbd1;letter-spacing:-.01em}.chat-head-sub{font-size:10px;color:#6f737d}.chat{margin:0;display:flex;flex-direction:column;gap:9px}.msg{max-width:86%;padding:13px 16px;border-radius:19px;font-size:17px;line-height:1.35;animation:msgIn .24s ease both;word-break:break-word}.msg:nth-child(2){animation-delay:.12s}.msg:nth-child(3){animation-delay:.24s}.msg:nth-child(4){animation-delay:.36s}.msg.them{align-self:flex-start;background:var(--bubble);border-bottom-left-radius:7px}.msg.you{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:7px}
.chat-shell.chat-short{margin-top:2px}.chat-short .chat-head{padding-bottom:8px}.chat-short .msg{max-width:88%}
.chat-shell.chat-medium{padding:12px 10px 14px;border:1px solid rgba(255,255,255,.055);background:rgba(21,23,28,.62);border-radius:24px}.chat-medium .chat-head{padding-left:4px}.chat-medium .msg{max-width:84%}
.chat-shell.chat-long{padding:14px 10px 16px;border:1px solid rgba(255,255,255,.07);background:linear-gradient(180deg,rgba(21,23,28,.86),rgba(14,15,19,.68));border-radius:26px;box-shadow:inset 0 1px rgba(255,255,255,.025)}.chat-long .chat-head{position:sticky;top:67px;z-index:2;margin:-4px -2px 10px;padding:4px 6px 10px;background:linear-gradient(rgba(21,23,28,.98),rgba(21,23,28,.86),transparent);backdrop-filter:blur(8px)}.chat-long .msg{max-width:82%;padding:12px 15px;font-size:16px}.chat-long .chat{gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:8px 0 20px}.small{font-size:14px;color:var(--muted);line-height:1.45}
.narrative-wrap{margin:18px 0 28px;max-width:94%}.narrative-label{margin:0 0 7px 14px;color:#6f7480;font-size:10px;line-height:1.2;letter-spacing:.14em;text-transform:uppercase;font-weight:600}.narrative{margin:0;padding:2px 0 2px 14px;border-left:2px solid #4b515d;color:#aeb2bc;font-size:14px;line-height:1.6;max-width:100%}.narrative-before{margin-top:14px;margin-bottom:18px}
.choices{margin-top:auto;display:grid;gap:10px}.choice{width:100%;min-height:52px;border:0;border-radius:18px;padding:15px 17px;background:var(--panel2);color:var(--text);font-size:16px;text-align:left;cursor:pointer;transition:transform .12s ease,background .18s ease,border-color .18s ease; border:1px solid rgba(255,255,255,.035)}.choice.primary{background:#f2f2f7;color:#0b0c0f}.choice:active{transform:scale(.985)}.choice:focus-visible{outline:3px solid #fff;outline-offset:3px}
.scene-short .choices{padding-top:2px}.scene-medium .choices{padding-top:6px}.scene-long .choices{margin-top:8px;padding:14px 0 2px;border-top:1px solid var(--line)}.scene-long .choice{min-height:54px}
.end-screen .card{margin-top:14px}.end-screen .choices{margin-top:12px}
html{background:var(--bg);transition:background-color .45s ease}
body,.app{transition:background-color .45s ease,color .45s ease}
.top{background:linear-gradient(var(--bg) 78%,transparent)}
html[data-theme="day"] .top{background:linear-gradient(var(--bg) 78%,transparent)}
html[data-theme="day"] .sound-toggle{background:rgba(255,255,255,.78);border-color:#d8dbe1;color:#17181c}
html[data-theme="day"] .brand,
html[data-theme="day"] .chat-head-title{color:#4f535c}
html[data-theme="day"] .chat-head-sub{color:#8a8e97}
html[data-theme="day"] .chat-avatar{background:#eef0f3;border-color:#d8dbe1;color:#666b75}
html[data-theme="day"] .msg.them{background:#d7e9ff;color:#142033}
html[data-theme="day"] .msg.you{background:#007aff;color:#fff}
html[data-theme="day"] .chat-shell.chat-medium{border-color:rgba(0,0,0,.06);background:rgba(255,255,255,.68)}
html[data-theme="day"] .chat-shell.chat-long{border-color:rgba(0,0,0,.07);background:linear-gradient(180deg,rgba(255,255,255,.90),rgba(244,245,247,.78));box-shadow:inset 0 1px rgba(255,255,255,.8)}
html[data-theme="day"] .chat-long .chat-head{background:linear-gradient(rgba(255,255,255,.98),rgba(255,255,255,.88),transparent)}
html[data-theme="day"] .narrative{color:#5f646e;border-left-color:#b8bdc7}
html[data-theme="day"] .narrative-label,.scene-meta{color:#777c86}
html[data-theme="day"] .scene-meta .scene-dot{background:#a0a5ae}
html[data-theme="day"] .choice{background:#e9ebef;border-color:rgba(0,0,0,.045)}
html[data-theme="day"] .choice.primary{background:#17181c;color:#fff}
html[data-theme="day"] .story-state{color:#777c86}
html[data-theme="day"] .story-state.tense{color:#4f535c}
html[data-theme="day"] .scene-long .choices{border-top-color:#d8dbe1}

@media (min-width:900px){
  body{background:radial-gradient(circle at 50% 8%,rgba(10,132,255,.045),transparent 34%),var(--bg)}
  .app{width:min(100%,800px);padding-left:24px;padding-right:24px}
  .screen{padding-top:34px}
  .chat-shell.chat-medium,.chat-shell.chat-long{box-shadow:0 18px 60px rgba(0,0,0,.14)}
  html[data-theme="day"] .chat-shell.chat-medium,html[data-theme="day"] .chat-shell.chat-long{box-shadow:0 18px 60px rgba(20,40,70,.08)}
}
@media (max-width:520px){.app{padding-left:13px;padding-right:13px}.screen{padding-top:22px}.msg{font-size:16px;max-width:89%}.chat-long .msg{font-size:15.5px;max-width:86%}.chat-long .chat-head{top:62px}.choice{font-size:15.5px}}
/* Финальные обои переписки: реальный слой чернил из референса. */
.chat-shell{position:relative;isolation:isolate;overflow:hidden;border-radius:26px;background-color:transparent;background-size:cover;background-position:center top;background-repeat:no-repeat;}
.chat-shell::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));}
.chat-shell::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:rgba(255,255,255,.03);}
.chat-shell>*{position:relative;z-index:2;}
html[data-theme="night"] .chat-shell{background-color:#0b0c0f;background-blend-mode:multiply;}
html[data-theme="night"] .chat-shell::before{background:linear-gradient(180deg,rgba(0,8,20,.30),rgba(0,0,0,.52));}
html[data-theme="night"] .chat-shell::after{background:rgba(0,12,28,.16);}
html[data-theme="day"] .chat-shell{background-color:#f4f5f7;background-blend-mode:normal;}
html[data-theme="day"] .chat-shell::before{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));}
html[data-theme="day"] .chat-shell::after{background:rgba(255,255,255,.01);}
.chat-shell.chat-medium,.chat-shell.chat-long{background-color:transparent;}
html[data-theme="night"] .chat-shell.chat-medium,html[data-theme="night"] .chat-shell.chat-long{background-color:#10141b;background-blend-mode:multiply;}
html[data-theme="day"] .chat-shell.chat-medium,html[data-theme="day"] .chat-shell.chat-long{background-color:#f4f5f7;background-blend-mode:normal;}

/* FINAL WALLPAPER: real image layer. */
.chat-shell{position:relative;isolation:isolate;overflow:hidden;border-radius:26px;}
.chat-wallpaper{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;display:block!important;z-index:0!important;pointer-events:none!important;object-fit:cover!important;object-position:center center!important;opacity:.72!important;filter:grayscale(100%) contrast(1.08) brightness(1.02)!important;}
.chat-shell > .chat-head,.chat-shell > .chat{position:relative;z-index:2;}
html[data-theme="day"] .chat-wallpaper{opacity:.66!important;filter:grayscale(100%) contrast(1.10) brightness(1.03)!important;}
html[data-theme="night"] .chat-wallpaper{opacity:.56!important;filter:grayscale(100%) contrast(1.16) brightness(.62)!important;}
.chat-shell.chat-long .chat-head{z-index:3;}

/* Дополнительные стили интерфейса: классы используются render(), поэтому они должны быть определены. */
.intro-hero{display:flex;flex-direction:column;gap:0}
.intro-mark{font-size:11px;letter-spacing:.16em;color:var(--muted);line-height:1.25;margin-bottom:18px}
.intro-sub{max-width:680px;color:var(--muted)}
.intro-card{display:flex;align-items:flex-start;gap:14px;margin:10px 0 24px;padding:16px 17px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}
.intro-card-num{font-size:12px;letter-spacing:.12em;color:var(--accent);padding-top:2px}
.end-card{margin:18px 0;padding:16px 18px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}
.end-card p{margin:7px 0 0}
.end-cta{margin:18px 0 24px;padding:16px 17px;border-left:2px solid var(--accent);border-radius:0 16px 16px 0;background:var(--panel);color:var(--muted);font-size:14px;line-height:1.5}
.typing{align-self:flex-start;display:flex;gap:4px;padding:11px 14px;border-radius:16px;background:var(--panel2);margin:0 0 1px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:typingPulse 1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.12s}.typing i:nth-child(3){animation-delay:.24s}
@keyframes typingPulse{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
.fade{animation:screenIn .22s ease both}
@keyframes screenIn{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<main class="app" id="app">
<div class="top"><div class="top-main"><div class="brand">ДО / ПОСЛЕ</div><div class="story-state" id="storyState">ИСТОРИЯ</div></div><button class="sound-toggle" id="soundToggle" type="button" aria-label="Включить звук" title="Звук">🔇</button></div>
<section class="screen fade" id="screen" aria-live="polite"></section>
</main>
<script>
const nodes={"start":{"type":"intro","title":"ДО / ПОСЛЕ","text":"Интерактивная история о том, как обычное общение может постепенно менять правила. Здесь нет заранее «правильного» маршрута: каждое решение влияет на то, что произойдёт дальше.","button":"Начать","next":"contact"},"contact":{"title":"ТЕБЕ ПИШЕТ НЕЗНАКОМЫЙ ЧЕЛОВЕК.","chat":[["them","Привет. Видел твой пост. Круто написал. Мы раньше не общались?"]],"choices":[["Не хочу общаться.","contact_pressure"],["Нет, не общались. А ты кто?","contact_open"],["Ничего не отвечать.","contact_silent"]]},"contact_pressure":{"title":"ТЫ ПОСТАВИЛ ГРАНИЦУ.","chat":[["them","Да ладно. Чего ты сразу? Просто пять минут поговорим."]],"choices":[["Нет. Я сказал, что не хочу.","end_boundary"],["Ну ладно. Что хотел?","pressure_continue"],["Заблокировать.","end_block"]],"echoChoice":true},"contact_silent":{"title":"ТЫ НЕ ОТВЕТИЛ.","chat":[["them","Окей. Если не хочешь — не отвечай. Просто подумал, что тебе может быть интересно."],["them","Если всё-таки интересно, могу рассказать про один закрытый чат."]],"text":"Он не требует ответа и не давит. Но оставляет возможность продолжить разговор, если ты сам захочешь.","choices":[["Не отвечать.","end_silent"],["Что за чат?","chat_info"]]},"contact_open":{"title":"ТЫ ОТВЕТИЛ.","chat":[["them","Да просто увидел твой пост. Интересно пишешь. Есть закрытый чат, там ребята примерно твоего возраста. Могу скинуть, если хочешь."]],"choices":[["Что за чат?","chat_info"],["Неинтересно.","chat_refuse"],["Добавь меня.","chat_join"]],"echoChoice":true},"chat_refuse":{"title":"ТЫ ОТКАЗАЛСЯ.","chat":[["them","Окей. Не буду навязываться."]],"choices":[["Закончить историю.","end_safe"]],"echoChoice":true},"chat_info":{"title":"ТЫ УЗНАЁШЬ О ЧАТЕ.","chat":[["them","Это обычный закрытый чат. Обсуждаем музыку, новости и то, что происходит вокруг. Если не зайдёт — выйдешь."]],"choices":[["Если можно, добавь меня.","chat_join"],["Нет, спасибо.","chat_refuse"],["А зачем он закрытый?","chat_why"]],"echoChoice":tru }

function choose(index){
  const node=nodes[state.node];
  if(!node||!Array.isArray(node.choices)||!node.choices[index]) return;
  const [label,next]=node.choices[index];
  if(!nodes[next]) return;
  state.path.push({node:state.node,choice:label});
  state.node=next;
  render();
}

      html+='<div class="chat-head"><div class="chat-avatar">•••</div><div class="chat-head-text"><div class="chat-head-title">Переписка</div><div class="chat-head-sub">сообщения</div></div></div>';
      html+='<div class="chat">';
      if(node.echoChoice && state.path.length){ const prev=state.path[state.path.length-1]; html+='<div class="msg you">'+esc(prev.choice)+'</div>'; }
      if(Array.isArray(node.chat)) html+=node.chat.map(m=>'<div class="msg '+(m[0]==="you"?'you':'them')+'">'+esc(m[1])+'</div>').join('');
      if(Array.isArray(node.chatAfter)) html+=node.chatAfter.map(m=>'<div class="msg '+(m[0]==="you"?'you':'them')+'">'+esc(m[1])+'</div>').join('');
      html+='</div></div>';
    }
    if(node.text) html+='<div class="narrative-wrap"><div class="narrative-label">Происходящее</div><div class="narrative">'+esc(node.text)+'</div></div>';
    html+='<div class="choices">'+node.choices.map((c,i)=>'<button type="button" class="choice '+(i===0?'primary':'')+'" data-choice="'+i+'">'+esc(c[0])+'</button>').join('')+'</div>';
    html+='</div>';
  }
  screen.innerHTML=html;
  updateSoundButton();
  if(state.node!=="start"&&node.type!=="end"){playIncomingFor(node); if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches) revealMessages();}
  if(node.type==="end")audio.fadeOut();
  const first=screen.querySelector('button');
  if(first) first.focus({preventScroll:true});
  window.scrollTo({top:0,behavior:"smooth"});
}
document.addEventListener("click",e=>{
  const btn=e.target.closest("button");
  if(!btn) return;
  if(btn.id==="soundToggle"){audio.toggle();return;}
  if(btn.hasAttribute("data-start")){if(audio.enabled){audio.init();if(audio.ctx&&audio.ctx.state==="suspended")audio.ctx.resume();audio.startMusic();audio.fadeIn();}state.node=nodes.start.next;state.path.push({node:"start",choice:"Начать"});render();return;}
  if(btn.hasAttribute("data-restart")){restart();return;}
  if(btn.hasAttribute("data-choice")){if(audio.enabled){if(!audio.started)audio.init();if(audio.ctx&&audio.ctx.state==="suspended")audio.ctx.resume();audio.send();}choose(Number(btn.dataset.choice));}
});
document.addEventListener("visibilitychange",()=>{if(!audio.started)return;if(document.hidden)audio.fadeOut();else if(audio.enabled)audio.fadeIn()});
render();
updateSoundButton();
</script>
